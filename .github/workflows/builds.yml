# Checks Hiltwright on Windows and on a Mac, and builds a test build for each. Run it by hand (Actions, "Test builds",
# Run workflow). The builds are attached to the run as artifacts; nothing is published and no release is made.
#
# What each job proves on its runner: the tests pass, the first-time toolchain setup works (arduino-cli, the
# Proffieboard core with its compiler and dfu-util, ProffieOS), and real firmware compiles with it. What no runner can
# prove: anything that needs a saber plugged in (connecting, installing firmware), and how the window looks.
#
# These are test builds, not releases. They have no font packs: the six free ProffieOS fonts are not in the
# repository (docs/font-packs.md), so an installer made here is not the one a release ships. A release's Windows
# installer is still built on the owner's PC with the packs in place (docs/releasing.md). Neither build is signed with
# a certificate; the macOS one is signed ad hoc, so macOS asks before it opens it.
name: Test builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash: one of the tests starts Windows PowerShell, which fails when PowerShell 7 started the run.
        shell: bash
    env:
      # A short folder, as the installed app uses: the compiler needs short paths on Windows.
      TOOLCHAIN: C:\hw-tc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The lockfile is written on Windows, so this is the exact set of packages a release is built from.
      - run: npm ci
      - name: Third-party notices match the installed packages
        run: npm run notices --workspace @hiltwright/desktop -- --check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: First-time toolchain setup, for real
        working-directory: apps/desktop
        run: HILTWRIGHT_REAL_SETUP="$TOOLCHAIN" npx vitest run test/realSetup.test.ts
      - name: Compile real firmware with it
        working-directory: apps/desktop
        run: HILTWRIGHT_TOOLCHAIN_DIR="$TOOLCHAIN" npx vitest run test/build.test.ts
      - name: Build the app
        run: npm run build --workspace @hiltwright/desktop
      - name: Package for Windows (no font packs)
        working-directory: apps/desktop
        run: |
          mkdir -p resources/packs
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: hiltwright-windows-test-build
          path: |
            apps/desktop/release/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Where the installed app keeps its toolchain on a Mac: under its data folder, which has a space in its path.
      TOOLCHAIN: /Users/runner/Library/Application Support/Hiltwright/toolchain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The lockfile is written on Windows and records only Windows builds of the packages that ship a binary for
      # each system (rollup, esbuild), so `npm ci` leaves a Mac without them. A test build resolves afresh instead,
      # and the third-party notices are written again for the versions that resolved.
      - name: Install dependencies for macOS
        run: |
          rm package-lock.json
          npm install
          npm run notices --workspace @hiltwright/desktop
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: What the USB registry and the mount list look like here (for the bootloader and card lookups)
        continue-on-error: true
        run: |
          ioreg -r -c IOUSBHostDevice -l -w 0 | head -60
          echo "--- mount (for the SD card list)"
          mount
      - name: First-time toolchain setup, for real
        working-directory: apps/desktop
        run: HILTWRIGHT_REAL_SETUP="$TOOLCHAIN" npx vitest run test/realSetup.test.ts
      - name: Compile real firmware with it
        working-directory: apps/desktop
        run: HILTWRIGHT_TOOLCHAIN_DIR="$TOOLCHAIN" npx vitest run test/build.test.ts
      - name: Build the app
        run: npm run build --workspace @hiltwright/desktop
      - name: Package for macOS (no font packs)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p resources/packs
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: hiltwright-macos-test-build
          path: |
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
