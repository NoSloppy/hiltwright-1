# Checks Hiltwright on a Mac and builds an unsigned macOS test build. Run it by hand (Actions, "macOS test build",
# Run workflow). The disk images are attached to the run as an artifact; nothing is published and no release is made.
#
# What it proves on the runner: the tests pass on macOS, the first-time toolchain setup works there (arduino-cli, the
# Proffieboard core with its compiler and dfu-util, ProffieOS), and real firmware compiles with it. What it cannot
# prove: anything that needs a saber plugged in (connecting, installing firmware), and how the window looks.
#
# The build has no font packs (they are not in the repository) and is signed ad hoc, so macOS asks before it opens it.
name: macOS test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Where the installed app keeps its toolchain on a Mac: under its data folder, which has a space in its path.
      TOOLCHAIN: /Users/runner/Library/Application Support/Hiltwright/toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile is written on Windows and records only Windows builds of the packages that ship a binary for
      # each system (rollup, esbuild), so `npm ci` leaves a Mac without them. A test build resolves afresh instead,
      # and the third-party notices are written again for the versions that resolved.
      - name: Install dependencies for macOS
        run: |
          rm package-lock.json
          npm install
          npm run notices --workspace @hiltwright/desktop
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: What the USB registry looks like here (for the bootloader lookup)
        continue-on-error: true
        run: ioreg -r -c IOUSBHostDevice -l -w 0 | head -80
      - name: First-time toolchain setup, for real
        working-directory: apps/desktop
        run: HILTWRIGHT_REAL_SETUP="$TOOLCHAIN" npx vitest run test/realSetup.test.ts
      - name: Compile real firmware with it
        working-directory: apps/desktop
        run: HILTWRIGHT_TOOLCHAIN_DIR="$TOOLCHAIN" npx vitest run test/build.test.ts
      - name: Build the app
        run: npm run build --workspace @hiltwright/desktop
      - name: Package for macOS
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p resources/packs
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hiltwright-macos-test-build
          path: |
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
