# Builds the website in site/ and publishes it with GitHub Pages.
# One-time setup in the repository: Settings, Pages, Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/install-guide.md'
      - 'docs/release-notes-beta-*.md'
      - 'docs/images/**'
      - 'packages/core/src/sim.ts'
      - 'packages/core/src/lookLibrary.ts'
      # The site shows the app's theme paintings and icon (site/build.mjs copies them in).
      - 'apps/desktop/src/renderer/src/assets/backdrops/**'
      - 'apps/desktop/src/renderer/src/assets/hiltwright-icon.svg'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
